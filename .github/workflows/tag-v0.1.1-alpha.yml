name: Tag EYGGDRANEX v0.1.1-alpha

on:
  push:
    branches:
      - release/v0.1.1-alpha
    paths:
      - ".github/workflows/tag-v0.1.1-alpha.yml"

permissions:
  contents: write
  actions: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit CI and create annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: "94710f70bf3a5d4adb8db779c2fbdde633bdaafb"
          CI_RUN_ID: "36147216660"
          TAG_NAME: "v0.1.1-alpha"
        run: |
          set -euo pipefail

          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.conclusion')"
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.head_sha')"

          test "$conclusion" = "success"
          test "$head_sha" = "$TARGET_SHA"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists; refusing to move it."
            exit 1
          fi

          git fetch origin "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "EYGGDRANEX v0.1.1-alpha — GENESIS Review Integration"
          git push origin "refs/tags/$TAG_NAME"
