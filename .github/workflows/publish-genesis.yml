name: Publish GENESIS Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-genesis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push release tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v0.1.0-alpha" >/dev/null 2>&1; then
            echo "Tag v0.1.0-alpha already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v0.1.0-alpha" "$GITHUB_SHA" -m "EYGGDRANEX v0.1.0-alpha — GENESIS"
            git push origin "v0.1.0-alpha"
          fi

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v0.1.0-alpha" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.0-alpha already exists."
          else
            gh release create "v0.1.0-alpha"               --repo "$GITHUB_REPOSITORY"               --title "EYGGDRANEX v0.1.0-alpha — GENESIS"               --notes-file "RELEASE_NOTES_v0.1.0-alpha.md"               --prerelease               --verify-tag
          fi
