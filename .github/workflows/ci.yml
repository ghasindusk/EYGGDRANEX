name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Golden digests are recorded per platform, so every recorded platform runs here.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Report golden digests for this platform
        # Prints the digests so a missing platform can be recorded deliberately.
        run: python tests/record_golden.py
      - name: Compile source
        run: python -m compileall -q src tests examples

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel into a clean environment and smoke-test both commands
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/eyggnx --steps 0 > eyggnx.json
          /tmp/wheel-env/bin/eyggdranex --steps 0 > eyggdranex.json
          cmp eyggnx.json eyggdranex.json
          /tmp/wheel-env/bin/python -c "import eyggnx, json; assert eyggnx.__version__; print(eyggnx.__version__)"
