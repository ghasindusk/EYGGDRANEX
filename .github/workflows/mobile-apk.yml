name: Android mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, codex/android-app]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: dart analyze lib test
      - name: Test
        working-directory: mobile
        run: flutter test --no-pub
      - name: Build personal-use APK
        working-directory: mobile
        run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: eyggdranex-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      # Google Play takes an App Bundle. CI has no upload key, so this bundle is signed with
      # the debug key and only proves the build; sign the real one locally (PLAY_RELEASE.md).
      - name: Build App Bundle (build check)
        working-directory: mobile
        run: flutter build appbundle --release --no-pub
