name: Bug report
description: Report a reproducible simulation or software defect
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    attributes:
      label: Description
    validations:
      required: true
  - type: input
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: input
    attributes:
      label: Seed
  - type: textarea
    attributes:
      label: Reproduction steps
    validations:
      required: true
